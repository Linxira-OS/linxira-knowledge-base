# SPA static hosting + /api reverse proxy for the enterprise compose stack.
# Mounted at /etc/nginx/conf.d/default.conf (see deploy/compose.yaml).
#
# Same-origin is required: session cookies and CSRF only work when the SPA and
# the API share an origin, which is what this proxy provides.
#
# TLS terminates in front of this server (an outer load balancer, or you can add
# a `listen 443 ssl` block). Before exposing real users, set
# `[auth] cookie_secure = true` in deploy/lkb.enterprise.toml.
#
# `lkb` resolves through the compose network DNS; when testing this file
# standalone, run e.g.
#   docker run --rm --add-host lkb:127.0.0.1 \
#     -v "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
#     nginx:stable-alpine nginx -t

upstream lkb_api {
    server lkb:7331;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Public liveness endpoint of the app.
    location = /health {
        proxy_pass http://lkb_api/health;
    }

    location /api/ {
        proxy_pass http://lkb_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # SSE (query/answer streams) must not be buffered by the proxy.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # SPA history fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits inspectable, deterministic asset names; they are content-stable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
