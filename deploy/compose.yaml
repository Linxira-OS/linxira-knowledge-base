# Enterprise deployment stack: PostgreSQL 16 + lkb + nginx (SPA + /api proxy).
#
# Quick start (from the repository root, or from the extracted enterprise bundle):
#   cp deploy/lkb.enterprise.toml.example deploy/lkb.enterprise.toml   # then edit it
#   cp deploy/.env.example deploy/.env                                 # set LKB_DB_PASSWORD
#   docker compose -f deploy/compose.yaml up -d
#   open http://localhost:8080/        # SPA; /api is reverse proxied to lkb
#
# The app image is one build for every profile; this stack only configures it as
# `profile = "enterprise"` with `storage.backend = "postgres"`. The same binary
# runs solo/SQLite with a different config — there is no separate build.
#
# Values come from deploy/.env (or the environment); see deploy/.env.example.

name: linxira-knowledge-base

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lkb
      POSTGRES_PASSWORD: ${LKB_DB_PASSWORD:?set LKB_DB_PASSWORD in deploy/.env}
      POSTGRES_DB: lkb
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lkb -d lkb"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  lkb:
    image: ghcr.io/linxira-os/linxira-knowledge-base:${LKB_IMAGE_TAG:-latest}
    # `--config` is a global flag; /etc/lkb/lkb.toml is the file below.
    command: ["serve", "--config", "/etc/lkb/lkb.toml"]
    environment:
      LKB_DATABASE_URL: postgres://lkb:${LKB_DB_PASSWORD:?set LKB_DB_PASSWORD in deploy/.env}@db:5432/lkb
      LKB_LOG_FORMAT: json
      LKB_LOG_LEVEL: ${LKB_LOG_LEVEL:-info}
    configs:
      - source: lkb_enterprise_toml
        target: /etc/lkb/lkb.toml
    volumes:
      - lkb_data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7331/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    ports:
      - "${LKB_HTTP_PORT:-8080}:80"
    volumes:
      # The SPA is served from the repository/bundle copy (web/dist), not from
      # the app image; keep the two in sync when you upgrade lkb.
      - ../web/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      lkb:
        condition: service_healthy
    restart: unless-stopped

# Operator config must exist before `up`: copy the example first (the file is
# gitignored). Compose fails fast when it is missing.
configs:
  lkb_enterprise_toml:
    file: ./lkb.enterprise.toml

volumes:
  pg_data:
  lkb_data:
