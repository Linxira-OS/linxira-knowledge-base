[package]
name = "lkb-desktop"
version = "0.2.2"
description = "Linxira Knowledge Base desktop shell (Windows/Linux)"
edition = "2021"
rust-version = "1.82"
# The shell is part of the permissive product surface; the bundled sidecar
# binary remains AGPL-3.0-only. See LICENSING.md.
license = "MIT OR Apache-2.0"
publish = false

# Standalone crate: it must never join the repository root package build.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
dirs = "7"
serde = { version = "1", features = ["derive"] }
toml = "1"

# The PostgreSQL password lives in the OS credential store when one is
# available; pg.env is only the documented fallback (see desktop/README.md).
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[profile.release]
strip = true
lto = "thin"
