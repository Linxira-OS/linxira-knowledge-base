name: Bug 报告
description: 报告可复现的缺陷（请勿粘贴密钥、令牌或数据库连接串）
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢报告问题。提交前请注意：
        - 请勿在 issue 中粘贴任何密钥、令牌、会话 cookie、数据库连接串或 `.lkb/pg.env` 内容；
          安全漏洞请走 [Security Advisories](https://github.com/Linxira-OS/linxira-knowledge-base/security/advisories/new) 私密上报。
        - 日志与配置请脱敏后再粘贴。
  - type: input
    id: version
    attributes:
      label: 版本 / 提交
      description: 例如 `0.2.0` 或 commit hash
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Profile / 部署模式
      options:
        - solo（SQLite 单机）
        - team（PostgreSQL）
        - enterprise（PostgreSQL）
        - 其他 / 不确定
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: 操作系统 / 工具链
      description: 例如 Windows 11 + `stable-x86_64-pc-windows-gnu`（MSYS2 gcc），或 Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 现象
      description: 实际发生了什么？请附完整错误信息（已脱敏）。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 最小复现步骤
      description: 命令、配置（脱敏）、HTTP 请求等；越具体越好。
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 issue，未发现重复
          required: true
        - label: 我已移除所有敏感信息（密钥 / 令牌 / 连接串）
          required: true
