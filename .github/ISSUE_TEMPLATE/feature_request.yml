name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请先确认该建议不属于已知边界（见 README「当前状态」与 `document/build-policy.md` 的实现边界列表）。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述真实场景与痛点，而不是直接给实现方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 现在如何绕过
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 检索 / RAG / Answer 契约
        - Wiki / 空间 / 权限
        - 多租户 / 配额 / 计费
        - 模型网关 / 连接器
        - SSO / 认证
        - Web 前端 / CLI / MCP
        - 文档 / 其他
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 issue，未发现重复
          required: true
