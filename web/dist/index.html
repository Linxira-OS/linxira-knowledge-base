<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0d0d0f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <title>Layered Knowledge Base</title>
    <script>
      // Theme is resolved before first paint so the shell never flashes.
      ;(function () {
        try {
          var stored = localStorage.getItem('lkb-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = theme
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
      ;(function () {
        // Locale default follows the same rule as the server (Accept-Language
        // order), but a stored choice always wins.
        try {
          var storedLocale = localStorage.getItem('lkb-locale')
          var system = (navigator.language || 'en').toLowerCase().startsWith('zh') ? 'zh-CN' : 'en'
          document.documentElement.lang = storedLocale || system
        } catch (error) {
          document.documentElement.lang = 'en'
        }
      })()
    </script>

  </head>

  </body>
</html>
